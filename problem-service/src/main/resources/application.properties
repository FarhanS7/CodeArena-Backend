spring.application.name=com.codearena.problemservice
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/problem_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=*
spring-openapi.title=Problem Service API
spring-openapi.version=1.0
spring-openapi.description=API documentation for CodeArena Problem Service
